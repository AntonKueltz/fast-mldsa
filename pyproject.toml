[project]
name = "fast-mldsa"
version = "0.1.0"
description = "Fast module-lattice digital signatures"
readme = "README.md"
requires-python = ">=3.11"

license = "CC0-1.0"
license-files = ["LICENSE"]
authors = [
    {name = "Anton Kueltz", email = "kueltz.anton@gmail.com"}
]
keywords = ["mldsa", "ml-dsa", "lattice", "module-lattice", "cryptography", "post-quantum", "pqc", "fips-204"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Security :: Cryptography",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
    "Programming Language :: Rust",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux"
]

[project.urls]
source = "https://github.com/AntonKueltz/fast-mldsa"
documentation = "https://fast-mldsa.readthedocs.io"
pypi = "https://pypi.org/project/fast-mldsa/"

[project.scripts]
benchmark = "fast_mldsa.benchmark:main"

[dependency-groups]
dev = [
    "ipython>=9.17.1",
    "maturin>=1.15.0",
    "parameterized>=0.9.0",
    "pre-commit>=4.7.0",
    "pycryptodome>=4.1.0",
    "pytest>=9.1.1",
    "sphinx>=9.0.4",
    "sphinx-rtd-theme>=3.1.0",
]

[build-system]
requires = ["maturin>=1.15,<2.0"]
build-backend = "maturin"

[tool.maturin]
module-name = "fast_mldsa.rust"
manifest-path = "py-bindings/Cargo.toml"

[tool.pytest.ini_options]
markers = [
    "slow: marks tests as slow (skipped by default)"
]
addopts = "-m 'not slow'"
